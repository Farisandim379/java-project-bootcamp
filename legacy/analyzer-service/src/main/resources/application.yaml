spring:
  application:
    name: analyzer-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/belajar_db}
    username: ${DB_USERNAME:dev}
    password: ${DB_PASSWORD:devpassword}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis


eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka


jwt:
  secret: d06f6d1cfd3bdedd062aace4e94f6f7bd87f30083e24bd369bf3ef6ed6a13260
  expiration: 3600000

kafka:
  bootstrap-servers: localhost:9092
  topic:
    analysis-created: analysis-created

report:
  scheduler:
    cron: "0 */1 * * * *"

minio:
  url: ${MINIO_URL:http://localhost:9000}
  access:
    name: ${MINIO_ACCESS_KEY:minioadmin}
    secret: ${MINIO_SECRET_KEY:minioadmin}
  bucket:
    name: ${MINIO_BUCKET:analyzer-report}
  presigned-expiry-minutes: 10

server:
  port: 8081
  servlet:
    context-path: /analyze


