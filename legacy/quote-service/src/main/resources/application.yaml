spring:
  application:
    name: quote-service

server:
  port: 8082
  servlet:
    context-path: /quote

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

dummyJson:
  url: https://dummyjson.com