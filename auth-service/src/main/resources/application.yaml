spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/belajar_db}
    username: ${DB_USERNAME:dev}
    password: ${DB_PASSWORD:devpassword}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8081

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}

jwt:
  secret: ${JWT_SECRET:d06f6d1cfd3bdedd062aace4e94f6f7bd87f30083e24bd369bf3ef6ed6a13260}
  expiration: ${JWT_EXPIRATION:86400000} # 24 jam dalam milidetik
